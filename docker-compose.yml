version: '3.8'

services:
  arangodb:
    image: arangodb:3.11.10
    container_name: arangodb_bench
    ports:
      - "8529:8529"
    environment:
      - ARANGO_ROOT_PASSWORD=rootpassword
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8529/_api/version"]
      interval: 3s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb:v4.20.3
    container_name: falkordb_bench
    ports:
      - "6379:6379"
    command: ["--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  memgraph:
    image: memgraph/memgraph:3.12.0
    container_name: memgraph_bench
    ports:
      - "7687:7687"
    command: ["--memory-limit=192"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s = socket.socket(); s.connect(('localhost', 7687))"]
      interval: 3s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  neo4j:
    image: neo4j:5.22.0-community
    container_name: neo4j_bench
    ports:
      - "7474:7474" # HTTP
      - "7473:7687" # Bolt (mapped to 7473 to avoid conflict with Memgraph)
    environment:
      - NEO4J_AUTH=neo4j/neo4jpassword
      - NEO4J_server_memory_heap_initial__size=96m
      - NEO4J_server_memory_heap_max__size=96m
      - NEO4J_server_memory_pagecache_size=16m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 3s
      timeout: 2s
      retries: 15
    restart: unless-stopped
