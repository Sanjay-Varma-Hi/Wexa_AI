version: '3.8'

services:
  arangodb:
    image: arangodb:3.11.10
    container_name: arangodb_bench
    ports:
      - "8529:8529"
    environment:
      - ARANGO_ROOT_PASSWORD=rootpassword
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "arangosh", "--server.endpoint", "tcp://127.0.0.1:8529", "--server.username", "root", "--server.password", "rootpassword", "--javascript.execute-string", "true"]
      interval: 3s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb:v4.20.3
    container_name: falkordb_bench
    ports:
      - "6379:6379"
    command: ["--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  memgraph:
    image: memgraph/memgraph:3.12.0
    container_name: memgraph_bench
    ports:
      - "7687:7687"
    command: ["--memory-limit=192"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole"]
      interval: 3s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  neo4j:
    image: neo4j:5.22.0-community
    container_name: neo4j_bench
    ports:
      - "7474:7474" # HTTP
      - "7473:7687" # Bolt (mapped to 7473 to avoid conflict with Memgraph)
    environment:
      - NEO4J_AUTH=neo4j/neo4jpassword
      - NEO4J_server_memory_heap_initial__size=96m
      - NEO4J_server_memory_heap_max__size=96m
      - NEO4J_server_memory_pagecache_size=16m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "cypher-shell", "-a", "bolt://localhost:7687", "-u", "neo4j", "-p", "neo4jpassword", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped
